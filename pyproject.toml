[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellos"
version = "0.1.0"
description = "Open framework for human-AI organizational coordination"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Filip Blagojević", email = "filip@resomnium.com" },
]
keywords = ["ai", "agents", "coordination", "organizational-design", "human-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]
diagnostic = [
    "questionary>=2.0",
]

[project.scripts]
cellos = "cellos.cli:main"
cellos-diagnostic = "cellos.diagnostic.cli:main"

[project.urls]
Homepage = "https://resomnium.com"
Repository = "https://github.com/resomnium/cellos"
Documentation = "https://github.com/resomnium/cellos#readme"

[tool.ruff]
line-length = 100
target-version = "py310"
