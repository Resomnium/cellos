# Minimal CellOS cell definition — use this as a starting template.
# A small product team with 1 human lead and 2 AI assistants.

id: starter-cell
name: Product Team
description: A minimal cell for a product team with human leadership and AI support.
mandate: Ship quality product features with clear human-AI coordination.

config:
  max_participants: 7
  require_human_oversight: true
  audit_all_actions: true

roles:
  - name: Product Lead
    steward_role: clarity
    participant_type: human
    description: Sets priorities, approves work, makes final decisions.
    decision_rights: full
    scope:
      allowed_actions:
        - set_priority
        - approve_work
        - review_output
        - assign_task
    kpis:
      - feature_completion_rate
      - decision_turnaround_time

  - name: Research Assistant
    steward_role: narrative
    participant_type: ai
    description: Researches competitors, analyzes data, drafts reports.
    decision_rights: conditional
    scope:
      allowed_actions:
        - search_web
        - analyze_data
        - draft_report
        - summarize
      forbidden_actions:
        - publish
        - contact_external
        - make_purchase
      requires_approval_for:
        - share_externally
    accountability_to: Product Lead
    escalation_rules:
      - trigger: confidence_low
        target_role: Product Lead
        threshold: 0.7
      - trigger: scope_boundary
        target_role: Product Lead
    kpis:
      - research_accuracy
      - report_quality

  - name: Task Executor
    steward_role: execution
    participant_type: ai
    description: Executes defined tasks, tracks progress, reports status.
    decision_rights: conditional
    scope:
      allowed_actions:
        - execute_task
        - track_progress
        - report_status
        - generate_output
      forbidden_actions:
        - approve_work
        - set_priority
        - contact_external
    accountability_to: Product Lead
    escalation_rules:
      - trigger: error
        target_role: Product Lead
      - trigger: timeout
        target_role: Product Lead
        timeout_seconds: 3600
    kpis:
      - task_completion_rate
      - on_time_delivery

participants:
  - id: lead-1
    name: Team Lead
    participant_type: human
    role: Product Lead
    capabilities:
      - strategy
      - decision_making
      - stakeholder_management
    availability: business_hours
    contact_protocol: email

  - id: researcher-1
    name: ResearchBot
    participant_type: ai
    role: Research Assistant
    capabilities:
      - web_research
      - data_analysis
      - report_writing
    availability: always
    contact_protocol: api

  - id: executor-1
    name: TaskBot
    participant_type: ai
    role: Task Executor
    capabilities:
      - code_generation
      - testing
      - deployment
    availability: always
    contact_protocol: api

handoff_protocols:
  - from_role: Research Assistant
    to_role: Product Lead
    trigger: research_complete
    required_context:
      - research_findings
      - confidence_score
      - data_sources
    validation: Product Lead acknowledges

  - from_role: Task Executor
    to_role: Product Lead
    trigger: task_complete_or_blocked
    required_context:
      - task_result
      - completion_status
      - blockers_if_any
    validation: Product Lead reviews output
