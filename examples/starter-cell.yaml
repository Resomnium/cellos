# Minimal CellOS cell definition - use this as a starting template.
# A small product team: five human stewards, flat, no boss.
# Each AI agent works beneath the steward who owns its function.

id: starter-cell
name: Product Team
description: A minimal cell for a product team. Five human stewards, two AI agents beneath them.
mandate: Ship quality product features with clear human-AI coordination.

config:
  max_participants: 7
  require_human_oversight: true
  require_human_stewards: true
  audit_all_actions: true

roles:
  - name: Clarity Steward
    steward_role: clarity
    participant_type: human
    description: Owns the question. Sets direction and scope, decides what done means.
    decision_rights: full
    scope:
      allowed_actions:
        - set_priority
        - define_scope
        - review_output
    kpis:
      - roadmap_focus
      - decision_turnaround_time

  - name: Execution Steward
    steward_role: execution
    participant_type: human
    description: Owns the doing. Delivery, quality, tooling, and what gets automated.
    decision_rights: full
    scope:
      allowed_actions:
        - assign_task
        - approve_work
        - review_output
    kpis:
      - feature_completion_rate
      - defect_escape_rate

  - name: Narrative Steward
    steward_role: narrative
    participant_type: human
    description: Owns the story. Release notes, docs, and how the product is described.
    decision_rights: full
    scope:
      allowed_actions:
        - publish
        - approve_copy
    kpis:
      - docs_freshness
      - release_note_reach

  - name: Access Steward
    steward_role: access
    participant_type: human
    description: Owns the doors. Customers, partners, and the conversations that need a human.
    decision_rights: full
    scope:
      allowed_actions:
        - contact_external
        - make_commitment
    kpis:
      - customer_interviews_per_month
      - partner_response_time

  - name: Integrity Steward
    steward_role: integrity
    participant_type: human
    description: Owns trust. Governance, incentives, conflict and accountability.
    decision_rights: full
    scope:
      allowed_actions:
        - audit
        - resolve_conflict
        - approve_spend
    kpis:
      - open_conflicts
      - audit_findings_closed

  - name: Research Assistant
    participant_type: ai
    description: Researches competitors, analyzes data, drafts reports for the Clarity Steward.
    decision_rights: conditional
    scope:
      allowed_actions:
        - search_web
        - analyze_data
        - draft_report
        - summarize
      forbidden_actions:
        - publish
        - contact_external
        - make_purchase
      requires_approval_for:
        - share_externally
    accountability_to: Clarity Steward
    escalation_rules:
      - trigger: confidence_low
        target_role: Clarity Steward
        threshold: 0.7
      - trigger: scope_boundary
        target_role: Clarity Steward
    kpis:
      - research_accuracy
      - report_quality

  - name: Task Executor
    participant_type: ai
    description: Executes defined tasks, tracks progress, reports status to the Execution Steward.
    decision_rights: conditional
    scope:
      allowed_actions:
        - execute_task
        - track_progress
        - report_status
        - generate_output
      forbidden_actions:
        - approve_work
        - set_priority
        - contact_external
    accountability_to: Execution Steward
    escalation_rules:
      - trigger: error
        target_role: Execution Steward
      - trigger: timeout
        target_role: Execution Steward
        timeout_seconds: 3600
    kpis:
      - task_completion_rate
      - on_time_delivery

participants:
  - id: clarity-1
    name: Clarity Steward
    participant_type: human
    role: Clarity Steward
    capabilities:
      - strategy
      - decision_making
    availability: business_hours
    contact_protocol: email

  - id: execution-1
    name: Execution Steward
    participant_type: human
    role: Execution Steward
    capabilities:
      - delivery
      - code_review
    availability: business_hours
    contact_protocol: email

  - id: narrative-1
    name: Narrative Steward
    participant_type: human
    role: Narrative Steward
    capabilities:
      - writing
      - documentation
    availability: business_hours
    contact_protocol: email

  - id: access-1
    name: Access Steward
    participant_type: human
    role: Access Steward
    capabilities:
      - customer_relationships
      - partnerships
    availability: business_hours
    contact_protocol: email

  - id: integrity-1
    name: Integrity Steward
    participant_type: human
    role: Integrity Steward
    capabilities:
      - audit
      - mediation
    availability: business_hours
    contact_protocol: email

  - id: researcher-1
    name: ResearchBot
    participant_type: ai
    role: Research Assistant
    capabilities:
      - web_research
      - data_analysis
      - report_writing
    availability: always
    contact_protocol: api

  - id: executor-1
    name: TaskBot
    participant_type: ai
    role: Task Executor
    capabilities:
      - code_generation
      - testing
      - deployment
    availability: always
    contact_protocol: api

handoff_protocols:
  - from_role: Research Assistant
    to_role: Clarity Steward
    trigger: research_complete
    required_context:
      - research_findings
      - confidence_score
      - data_sources
    validation: Clarity Steward acknowledges

  - from_role: Task Executor
    to_role: Execution Steward
    trigger: task_complete_or_blocked
    required_context:
      - task_result
      - completion_status
      - blockers_if_any
    validation: Execution Steward reviews output

  - from_role: Clarity Steward
    to_role: Execution Steward
    trigger: scope_agreed
    required_context:
      - scope
      - definition_of_done
    validation: Execution Steward accepts the scope as a peer
