# A reference cell in the shape Resomnium designs: five human stewards in a
# flat ring, no boss node, each steward running AI agents beneath them.
#
# Illustrative. This is not a record of how Resomnium operates today, and the
# five human seats are role titles, not named people. The one real agent here
# is Zach, Resomnium's public A2A inbox: it accepts a message, emails it to a
# human, and returns a receipt that says exactly that.

id: resomnium-reference
name: Resomnium Reference Cell
description: >
  A reference cell for an organizational design studio. Five human stewards
  own the five functions as peers. AI agents work beneath the steward whose
  function they serve, and every agent's chain ends at that human.
mandate: >
  Design organizations where humans and AI agents work together, then build
  what they run on, and keep improving the Cell Framework from how cells
  actually run.

config:
  max_participants: 12
  require_human_oversight: true
  require_human_stewards: true
  audit_all_actions: true
  default_escalation_timeout: 7200
  allow_ai_to_ai_handoffs: true
  require_scope_boundaries: true

roles:
  # --- The five human stewards (peers, no reporting lines between them) ---

  - name: Clarity Steward
    steward_role: clarity
    participant_type: human
    description: >
      Owns the question. Direction, scope, and what done means. Keeps the
      strategy from drifting as it meets reality.
    decision_rights: full
    scope:
      allowed_actions:
        - set_direction
        - define_scope
        - approve_research
        - review_output
    kpis:
      - decisions_reversed_per_quarter
      - methodology_improvements_per_quarter

  - name: Execution Steward
    steward_role: execution
    participant_type: human
    description: >
      Owns the doing. Delivery, quality, tooling, and the call on what gets
      automated and what stays human.
    decision_rights: full
    scope:
      allowed_actions:
        - plan_delivery
        - assign_task
        - approve_deliverable
        - decide_automation
        - review_output
    kpis:
      - on_time_delivery_rate
      - rework_rate

  - name: Narrative Steward
    steward_role: narrative
    participant_type: human
    description: >
      Owns the story. What is said, where, and in whose voice. Decides what
      goes out.
    decision_rights: full
    scope:
      allowed_actions:
        - approve_content
        - publish_content
        - set_voice
        - review_output
    kpis:
      - essays_published_per_month
      - reader_reply_rate

  - name: Access Steward
    steward_role: access
    participant_type: human
    description: >
      Owns the doors. Clients, partners, capital: the conversations that need
      a human with real authority across the table.
    decision_rights: full
    scope:
      allowed_actions:
        - engage_client
        - contact_lead
        - reply_to_inquiry
        - make_commitment
        - sign_partnership
    kpis:
      - client_satisfaction_score
      - inquiry_reply_time

  - name: Integrity Steward
    steward_role: integrity
    participant_type: human
    description: >
      Owns trust. Governance, incentives, conflict and accountability. The
      immune system of the cell.
    decision_rights: full
    scope:
      allowed_actions:
        - audit
        - set_incentives
        - resolve_conflict
        - approve_spend
        - review_output
    kpis:
      - open_conflicts
      - claims_corrected_before_publication

  # --- AI agents, each beneath the steward whose function it serves ---

  - name: Intelligence Analyst
    participant_type: ai
    description: >
      Keeps the map current. Gathers market intelligence, monitors trends,
      and synthesizes research into briefings for the Clarity Steward.
    decision_rights: conditional
    scope:
      allowed_actions:
        - search_web
        - analyze_data
        - generate_report
        - summarize_research
      forbidden_actions:
        - contact_client
        - publish_content
        - make_purchase
        - access_financial_data
      resource_limits:
        api_calls_per_day: 1000
        report_length_max_words: 5000
    accountability_to: Clarity Steward
    escalation_rules:
      - trigger: confidence_low
        target_role: Clarity Steward
        threshold: 0.6
        message_template: >
          Low confidence on research finding: {description}.
          Requesting human review.
      - trigger: scope_boundary
        target_role: Clarity Steward
    kpis:
      - research_accuracy_score
      - briefing_actionability_rating

  - name: Content Strategist
    participant_type: ai
    description: >
      Drafts essay outlines, plans the content calendar, and analyzes
      engagement. A human decides what goes out.
    decision_rights: advisory
    scope:
      allowed_actions:
        - draft_outline
        - suggest_topic
        - analyze_engagement
        - plan_calendar
      forbidden_actions:
        - publish_content
        - contact_client
        - make_purchase
      requires_approval_for:
        - change_calendar
    accountability_to: Narrative Steward
    escalation_rules:
      - trigger: scope_boundary
        target_role: Narrative Steward
    kpis:
      - drafts_accepted_rate
      - topic_relevance_score

  - name: Lead Generation Agent
    participant_type: ai
    description: >
      Scans funding databases, identifies potential clients, scores leads,
      and prepares outreach briefs for the Access Steward.
    decision_rights: conditional
    scope:
      allowed_actions:
        - search_leads
        - score_leads
        - generate_brief
        - track_pipeline
      forbidden_actions:
        - contact_lead
        - send_email
        - make_commitment
        - access_financial_data
      resource_limits:
        leads_per_cycle: 20
    accountability_to: Access Steward
    escalation_rules:
      - trigger: confidence_low
        target_role: Access Steward
        threshold: 0.7
      - trigger: scope_boundary
        target_role: Access Steward
    kpis:
      - qualified_leads_per_cycle
      - lead_score_accuracy

  - name: Relationship Manager
    participant_type: ai
    description: >
      Tracks client and partner relationships, prepares meeting briefs,
      and keeps CRM data current.
    decision_rights: advisory
    scope:
      allowed_actions:
        - update_crm
        - prepare_brief
        - suggest_connection
        - track_relationship
      forbidden_actions:
        - contact_client
        - send_email
        - make_commitment
        - share_confidential_data
      requires_approval_for:
        - suggest_introduction
    accountability_to: Access Steward
    escalation_rules:
      - trigger: scope_boundary
        target_role: Access Steward
    kpis:
      - relationship_health_score
      - meeting_prep_quality

  - name: Public Inbox
    participant_type: ai
    description: >
      Resomnium's public A2A endpoint. Accepts a message, emails it to the
      Access Steward, and returns a receipt that says it was delivered to a
      human. No LLM. It does not answer, decide, or act on the message.
    decision_rights: none
    scope:
      allowed_actions:
        - receive_message
        - relay_to_email
        - issue_receipt
      forbidden_actions:
        - reply_to_inquiry
        - make_commitment
        - analyze_data
    accountability_to: Access Steward
    escalation_rules:
      - trigger: error
        target_role: Access Steward
    kpis:
      - delivery_success_rate

  - name: Integrity Checker
    participant_type: ai
    description: >
      Checks outputs for consistency, compliance, and claims that cannot be
      backed. Logs and flags. Never overrules and never approves.
    decision_rights: advisory
    scope:
      allowed_actions:
        - review_output
        - flag_issue
        - check_compliance
        - log_finding
      forbidden_actions:
        - approve_deliverable
        - publish_content
        - contact_client
        - override_decision
    accountability_to: Integrity Steward
    escalation_rules:
      - trigger: scope_boundary
        target_role: Integrity Steward
      - trigger: error
        target_role: Integrity Steward
    kpis:
      - issues_caught_before_publication
      - false_positive_rate

participants:
  - id: clarity-steward
    name: Clarity Steward
    participant_type: human
    role: Clarity Steward
    capabilities:
      - strategy
      - research_review
      - decision_making
    availability: business_hours
    contact_protocol: email

  - id: execution-steward
    name: Execution Steward
    participant_type: human
    role: Execution Steward
    capabilities:
      - delivery
      - technical_architecture
      - automation_design
    availability: business_hours
    contact_protocol: email

  - id: narrative-steward
    name: Narrative Steward
    participant_type: human
    role: Narrative Steward
    capabilities:
      - content_writing
      - editing
      - distribution
    availability: business_hours
    contact_protocol: email

  - id: access-steward
    name: Access Steward
    participant_type: human
    role: Access Steward
    capabilities:
      - client_engagement
      - partnerships
      - negotiation
    availability: business_hours
    contact_protocol: email

  - id: integrity-steward
    name: Integrity Steward
    participant_type: human
    role: Integrity Steward
    capabilities:
      - governance
      - incentive_design
      - mediation
    availability: business_hours
    contact_protocol: email

  - id: vox
    name: Vox
    participant_type: ai
    role: Intelligence Analyst
    capabilities:
      - web_research
      - data_analysis
      - report_generation
      - trend_analysis
    availability: always
    contact_protocol: api

  - id: lester
    name: Lester
    participant_type: ai
    role: Content Strategist
    capabilities:
      - content_planning
      - copywriting
      - engagement_analysis
    availability: always
    contact_protocol: api

  - id: scout
    name: Scout
    participant_type: ai
    role: Lead Generation Agent
    capabilities:
      - lead_research
      - lead_scoring
      - outreach_drafting
      - pipeline_tracking
    availability: always
    contact_protocol: api

  - id: q
    name: Q
    participant_type: ai
    role: Relationship Manager
    capabilities:
      - crm_management
      - meeting_preparation
      - relationship_tracking
    availability: always
    contact_protocol: api

  - id: zach
    name: Zach
    participant_type: ai
    role: Public Inbox
    capabilities:
      - receive_message
      - relay_to_email
      - issue_receipt
    availability: always
    contact_protocol: a2a:https://resomnium.com/.well-known/agent-card.json

  - id: corra
    name: Corra
    participant_type: ai
    role: Integrity Checker
    capabilities:
      - quality_review
      - compliance_check
      - error_detection
    availability: always
    contact_protocol: api

handoff_protocols:
  # Agents hand work to the steward they work beneath.
  - from_role: Intelligence Analyst
    to_role: Clarity Steward
    trigger: research_complete
    required_context:
      - research_brief
      - confidence_score
      - data_sources
    validation: Clarity Steward reviews and acknowledges receipt

  - from_role: Content Strategist
    to_role: Narrative Steward
    trigger: draft_ready
    required_context:
      - draft_content
      - target_audience
      - distribution_channel
    validation: Narrative Steward decides what goes out

  - from_role: Lead Generation Agent
    to_role: Access Steward
    trigger: lead_qualified
    required_context:
      - lead_brief
      - qualification_score
      - recommended_approach
    validation: Access Steward approves or rejects outreach

  - from_role: Relationship Manager
    to_role: Access Steward
    trigger: brief_ready
    required_context:
      - meeting_brief
      - relationship_history
    validation: Access Steward reads the brief before the meeting

  - from_role: Public Inbox
    to_role: Access Steward
    trigger: message_received
    required_context:
      - sender
      - message
      - receipt_id
    validation: Access Steward replies or declines

  - from_role: Integrity Checker
    to_role: Integrity Steward
    trigger: issue_flagged
    required_context:
      - flagged_output
      - issue_found
      - evidence
    validation: Integrity Steward resolves or dismisses the flag

  # Agents can pass work across functions.
  - from_role: Content Strategist
    to_role: Integrity Checker
    trigger: claims_check_requested
    required_context:
      - draft_content
      - claims_to_verify
    validation: Integrity Checker logs every claim it could not back

  # Stewards hand off to each other as peers.
  - from_role: Access Steward
    to_role: Execution Steward
    trigger: engagement_signed
    required_context:
      - client
      - agreed_scope
      - deadline
    validation: Execution Steward accepts the scope as a peer
